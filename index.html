<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Hub</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#08090c;color:#eee;
 font-family:Arial,sans-serif;height:100vh;
 display:flex;flex-direction:column
}
header{
 height:60px;border-bottom:1px solid #292c33;
 display:flex;align-items:center;padding:0 18px;
 font-weight:bold;font-size:19px
}
.logo{color:#10a37f}
main{
 flex:1;display:flex;flex-direction:column;
 max-width:900px;width:100%;margin:auto;min-height:0
}
#messages{
 flex:1;overflow:auto;padding:25px 15px
}
.msg{
 display:flex;gap:12px;margin:20px 0;
 line-height:1.6;white-space:pre-wrap
}
.avatar{
 width:34px;height:34px;min-width:34px;
 border-radius:50%;display:grid;place-items:center;
 background:#292d36
}
.ai .avatar{background:#10a37f}
.text{max-width:750px}
.empty{
 text-align:center;color:#8d929d;
 margin-top:20vh
}
.empty h1{font-size:36px;color:white}
.composer{
 padding:14px 15px 20px
}
.box{
 display:flex;gap:8px;
 background:#17191f;border:1px solid #343740;
 border-radius:15px;padding:8px
}
textarea{
 flex:1;resize:none;background:none;border:0;
 outline:0;color:white;padding:10px;
 min-height:45px;max-height:150px
}
button{
 border:0;border-radius:10px;
 background:#292c34;color:white;
 padding:10px 15px;cursor:pointer
}
button:hover{background:#363a44}
.send{background:#10a37f}
.send:hover{background:#0d8d6d}
.status{
 text-align:center;font-size:12px;
 color:#777;margin-top:8px
}
.settings{
 position:fixed;right:15px;top:75px;
 background:#15171c;border:1px solid #333;
 padding:15px;border-radius:12px;
 width:300px;display:none;z-index:5
}
.settings input{
 width:100%;margin:6px 0 10px;
 padding:10px;border-radius:8px;
 border:1px solid #343740;
 background:#08090c;color:white
}
.settings.show{display:block}
.small{font-size:12px;color:#888;line-height:1.4}
</style>
</head>

<body>

<header>
 <span class="logo">✦</span>&nbsp; AI Hub
 <button style="margin-left:auto" onclick="toggleSettings()">⚙️</button>
</header>

<main>

<div id="messages">
 <div class="empty" id="empty">
  <h1>Чем могу помочь?</h1>
  <p>Твой собственный AI-чат</p>
 </div>
</div>

<div class="composer">
 <div class="box">
  <textarea id="input"
   placeholder="Напишите сообщение..."
   onkeydown="keyDown(event)"></textarea>

  <button class="send" onclick="send()">➤</button>
 </div>

 <div class="status" id="status">Готов</div>
</div>

</main>

<div class="settings" id="settings">
 <b>⚙️ Настройки</b>

 <p class="small">
 URL твоего Cloudflare Worker.
 </p>

 <input id="apiUrl"
 placeholder="https://my-ai.example.workers.dev">

 <button onclick="saveSettings()">Сохранить</button>

 <p class="small">
 API-ключ здесь НЕ нужен.
 Он хранится на сервере Worker.
 </p>
</div>

<script>
const input=document.getElementById("input");
const messages=document.getElementById("messages");
const status=document.getElementById("status");

let history=JSON.parse(
 localStorage.getItem("ai_history")||"[]"
);

function saveHistory(){
 localStorage.setItem(
  "ai_history",
  JSON.stringify(history)
 );
}

function loadSettings(){
 document.getElementById("apiUrl").value=
  localStorage.getItem("ai_worker")||"";
}

function saveSettings(){
 const url=document.getElementById("apiUrl").value.trim();

 if(!url){
  alert("Укажи URL Worker");
  return;
 }

 localStorage.setItem("ai_worker",url);
 toggleSettings();
}

function toggleSettings(){
 document.getElementById("settings")
 .classList.toggle("show");
}

function keyDown(e){
 if(e.key==="Enter"&&!e.shiftKey){
  e.preventDefault();
  send();
 }
}

function addMessage(role,text){
 document.getElementById("empty")?.remove();

 const row=document.createElement("div");
 row.className="msg "+(role==="assistant"?"ai":"user");

 const avatar=document.createElement("div");
 avatar.className="avatar";
 avatar.textContent=
  role==="assistant"?"✦":"👤";

 const body=document.createElement("div");
 body.className="text";
 body.textContent=text;

 row.appendChild(avatar);
 row.appendChild(body);

 messages.appendChild(row);
 messages.scrollTop=messages.scrollHeight;
}

function renderHistory(){
 messages.innerHTML="";

 if(!history.length){
  messages.innerHTML=`
   <div class="empty" id="empty">
    <h1>Чем могу помочь?</h1>
    <p>Твой собственный AI-чат</p>
   </div>`;
  return;
 }

 history.forEach(x=>{
  addMessage(x.role,x.content);
 });
}

async function send(){

 const text=input.value.trim();

 if(!text)return;

 const worker=
  localStorage.getItem("ai_worker");

 if(!worker){
  alert(
   "Сначала открой ⚙️ и укажи URL Cloudflare Worker."
  );
  return;
 }

 input.value="";

 addMessage("user",text);

 history.push({
  role:"user",
  content:text
 });

 saveHistory();

 status.textContent="AI думает...";

 try{

  const response=await fetch(
   worker.replace(/\/$/,"")+"/chat",
   {
    method:"POST",
    headers:{
     "Content-Type":"application/json"
    },
    body:JSON.stringify({
     messages:history
    })
   }
  );

  const data=await response.json();

  if(!response.ok){
   throw new Error(
    data.error||"Ошибка сервера"
   );
  }

  const answer=data.answer||"Пустой ответ.";

  addMessage("assistant",answer);

  history.push({
   role:"assistant",
   content:answer
  });

  saveHistory();

  status.textContent="Готов";

 }catch(error){

  const msg=
   "❌ Ошибка подключения:\n\n"+
   error.message;

  addMessage("assistant",msg);

  status.textContent="Ошибка";
 }
}

loadSettings();
renderHistory();
</script>

</body>
</html>
